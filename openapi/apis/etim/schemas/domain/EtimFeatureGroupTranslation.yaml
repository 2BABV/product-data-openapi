type: object
description: |
  Translation record for ETIM feature groups.
required:
  - featureGroupCode
  - languageCode
  - description
  - mutationDate
properties:
  featureGroupCode:
    type: string
    description: ETIM feature group code.
    pattern: "^EFG[0-9]{5}$"
    minLength: 8
    maxLength: 8
    examples:
      - "EFG00001"
  languageCode:
    $ref: ./EtimLanguageCode.yaml
  description:
    type: string
    description: Feature group description in the specified language.
    examples:
      - "Algemeen"
  mutationDate:
    type: string
    format: date-time
    description: Date and time of last mutation.
    examples:
      - "2024-06-15T10:30:00Z"
examples:
  - featureGroupCode: "EFG00001"
    languageCode: "nl-NL"
    description: "Algemeen"
    mutationDate: "2024-06-15T10:30:00Z"
  - featureGroupCode: "EFG00001"
    languageCode: "de-DE"
    description: "Allgemein"
    mutationDate: "2024-06-15T10:30:00Z"
