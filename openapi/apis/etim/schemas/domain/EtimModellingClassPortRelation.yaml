type: object
description: |
  Flat relation record for one port of an ETIM modelling class.
  Connection type versions are resolved through the selected ETIM release.
required:
  - classCode
  - classVersion
  - classRevision
  - portcode
  - connectionTypeCodes
  - mutationDate
properties:
  classCode:
    type: string
    description: ETIM modelling class code. Connection type classes do not define ports.
    pattern: "^MC[0-9]{6}$"
    minLength: 8
    maxLength: 8
    examples:
      - "MC000001"
  classVersion:
    type: integer
    description: Modelling class version number.
    minimum: 1
    examples:
      - 2
  classRevision:
    type: integer
    description: Revision of the owning modelling class aggregate.
    minimum: 0
    examples:
      - 1
  portcode:
    type: integer
    description: Port identifier within the modelling class.
    minimum: 1
    examples:
      - 1
  connectionTypeCodes:
    type: array
    description: Connection type codes assigned to this port. Empty when none are assigned.
    uniqueItems: true
    items:
      type: string
      pattern: "^CT[0-9]{6}$"
    examples:
      - ["CT000001", "CT000003"]
  mutationDate:
    type: string
    format: date-time
    description: Date and time of the last mutation of the owning modelling class aggregate.
    examples:
      - "2026-08-27T09:00:00Z"
examples:
  - classCode: "MC000001"
    classVersion: 2
    classRevision: 1
    portcode: 1
    connectionTypeCodes: ["CT000001", "CT000003"]
    mutationDate: "2026-08-27T09:00:00Z"
