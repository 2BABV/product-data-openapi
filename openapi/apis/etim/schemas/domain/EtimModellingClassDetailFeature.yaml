type: object
description: |
  Feature within a modelling class detail response.
  Extends class feature with modelling-specific fields (portcode, variable-axis units, dimensional drawing code).
required:
  - featureCode
  - type
  - orderNumber
  - values
properties:
  featureCode:
    type: string
    description: ETIM feature code.
    pattern: "^EF([0-9]{6}|I[0-9]{5}|[A-Z]{2}[0-9]{4})$"
    examples:
      - "EF000100"
  description:
    type: string
    description: Feature description in the requested language. Absent when no translation is available.
    examples:
      - "Nominale diameter"
  type:
    type: string
    description: Feature data type (Alphanumeric, Numeric, Range, Logical).
    examples:
      - "Numeric"
  orderNumber:
    type: integer
    description: Display order within the class.
    minimum: 1
    examples:
      - 1
  unit:
    $ref: ./EtimUnitReference.yaml
  unitImperial:
    $ref: ./EtimUnitReference.yaml
  unitVariableAxis:
    $ref: ./EtimUnitReference.yaml
  unitVariableAxisImperial:
    $ref: ./EtimUnitReference.yaml
  featureGroup:
    $ref: ./EtimFeatureGroupReference.yaml
  portcode:
    type: integer
    description: |
      Port this feature belongs to. Absent = class-level feature, present (≥ 1) = port-specific.
    minimum: 1
    examples:
      - 1
  dimensionalDrawingCode:
    type: string
    description: Dimensional drawing reference code. Absent when not applicable.
    examples:
      - "D1"
  values:
    type: array
    description: Allowed values for this feature.
    items:
      type: object
      required:
        - valueCode
        - orderNumber
      properties:
        valueCode:
          type: string
          pattern: "^EV[0-9]{6}$"
          examples:
            - "EV000050"
        description:
          type: string
          description: Value description in the requested language. Absent when no translation is available.
          examples:
            - "DN 15"
        orderNumber:
          type: integer
          minimum: 1
          examples:
            - 1
examples:
  - featureCode: "EF000100"
    description: "Nominale diameter"
    type: "Numeric"
    orderNumber: 1
    unit:
      code: "EU000001"
      description: "Millimeter"
      abbreviation: "mm"
    unitVariableAxis:
      code: "EU000020"
    featureGroup:
      code: "EFG00001"
      description: "Algemeen"
    dimensionalDrawingCode: "D1"
    values:
      - valueCode: "EV000050"
        description: "DN 15"
        orderNumber: 1

