type: object
description: |
  Flat representation of an ETIM group for bulk retrieval.
required:
  - code
  - description
  - deprecated
  - mutationDate
properties:
  code:
    type: string
    description: ETIM group code.
    pattern: "^EG[0-9]{6}$"
    minLength: 8
    maxLength: 8
    examples:
      - "EG000001"
  description:
    type: string
    description: Group description in ETIM English.
    examples:
      - "Installation (low voltage)"
  definition:
    type: string
    description: Definition or extended description of this group.
    examples:
      - "Products used for low-voltage electrical installation"
  deprecated:
    type: boolean
    description: Whether this group is deprecated.
    examples:
      - false
  successors:
    type: array
    description: Codes of successor groups that replace this one (typically when deprecated).
    items:
      type: string
      pattern: "^EG[0-9]{6}$"
      minLength: 8
      maxLength: 8
    examples:
      - ["EG000099"]
  mutationDate:
    type: string
    format: date-time
    description: Date and time of last mutation.
    examples:
      - "2024-06-15T10:30:00Z"
examples:
  - code: "EG000017"
    description: "Installation (low voltage)"
    deprecated: false
    mutationDate: "2024-06-15T10:30:00Z"
