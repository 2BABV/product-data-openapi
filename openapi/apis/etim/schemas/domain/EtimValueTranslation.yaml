type: object
description: |
  Translation record for ETIM values.
required:
  - valueCode
  - languageCode
  - description
  - mutationDate
properties:
  valueCode:
    type: string
    description: ETIM value code.
    pattern: "^EV[0-9]{6}$"
    minLength: 8
    maxLength: 8
    examples:
      - "EV000028"
  languageCode:
    $ref: ./EtimLanguageCode.yaml
  description:
    type: string
    description: Value description in the specified language.
    examples:
      - "Wit"
  mutationDate:
    type: string
    format: date-time
    description: Date and time of last mutation.
    examples:
      - "2024-06-15T10:30:00Z"
examples:
  - valueCode: "EV000028"
    languageCode: "nl-NL"
    description: "Wit"
    mutationDate: "2024-06-15T10:30:00Z"
  - valueCode: "EV000028"
    languageCode: "de-DE"
    description: "Weiß"
    mutationDate: "2024-06-15T10:30:00Z"
