type: object
description: |
  Reference to the ETIM feature group a feature is assigned to, embedded in
  class/modelling-class feature details. Description is localized to the requested language.
required:
  - code
properties:
  code:
    type: string
    description: ETIM feature group code.
    pattern: "^EFG[0-9]{5}$"
    minLength: 8
    maxLength: 8
    examples:
      - "EFG00001"
  description:
    type: string
    description: Feature group description in the requested language. Absent when no translation is available for the requested language.
    examples:
      - "General"
examples:
  - code: "EFG00001"
    description: "General"
