type: object
description: |
  Synonym record for regular ETIM classes (EC).
required:
  - classCode
  - classVersion
  - languageCode
  - synonym
  - mutationDate
properties:
  classCode:
    type: string
    description: ETIM class code.
    pattern: "^EC[0-9]{6}$"
    minLength: 8
    maxLength: 8
    examples:
      - "EC002714"
  classVersion:
    type: integer
    description: Class version number.
    minimum: 1
    examples:
      - 4
  languageCode:
    $ref: ./EtimLanguageCode.yaml
  synonym:
    type: string
    description: Class synonym in the specified language.
    examples:
      - "Stopcontact"
  mutationDate:
    type: string
    format: date-time
    description: Date and time of last mutation.
    examples:
      - "2024-06-15T10:30:00Z"
examples:
  - classCode: "EC002714"
    classVersion: 4
    languageCode: "nl-NL"
    synonym: "Stopcontact"
    mutationDate: "2024-06-15T10:30:00Z"
  - classCode: "EC002714"
    classVersion: 4
    languageCode: "de-DE"
    synonym: "Wandsteckdose"
    mutationDate: "2024-06-15T10:30:00Z"
