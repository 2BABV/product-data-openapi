type: object
description: |
  Translation record for ETIM modelling groups.
required:
  - groupCode
  - languageCode
  - description
  - mutationDate
properties:
  groupCode:
    type: string
    description: ETIM modelling group code.
    pattern: "^MG[0-9]{6}$"
    minLength: 8
    maxLength: 8
    examples:
      - "MG000001"
  languageCode:
    $ref: ./EtimLanguageCode.yaml
  description:
    type: string
    description: Modelling group description in the specified language.
    examples:
      - "Kleppen"
  mutationDate:
    type: string
    format: date-time
    description: Date and time of last mutation.
    examples:
      - "2024-06-15T10:30:00Z"
examples:
  - groupCode: "MG000001"
    languageCode: "nl-NL"
    description: "Kleppen"
    mutationDate: "2024-06-15T10:30:00Z"
  - groupCode: "MG000001"
    languageCode: "de-DE"
    description: "Ventile"
    mutationDate: "2024-06-15T10:30:00Z"
