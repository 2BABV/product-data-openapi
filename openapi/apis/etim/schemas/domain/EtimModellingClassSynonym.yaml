type: object
description: |
  Synonym record for ETIM modelling classes and connection types (MC/CT).
required:
  - classCode
  - classVersion
  - languageCode
  - synonym
  - mutationDate
properties:
  classCode:
    type: string
    description: ETIM modelling class code (MC = modelling class, CT = connection type).
    pattern: "^(MC|CT)[0-9]{6}$"
    minLength: 8
    maxLength: 8
    examples:
      - "MC000001"
  classVersion:
    type: integer
    description: Class version number.
    minimum: 1
    examples:
      - 2
  languageCode:
    $ref: ./EtimLanguageCode.yaml
  synonym:
    type: string
    description: Class synonym in the specified language.
    examples:
      - "Klepbehuizing"
  mutationDate:
    type: string
    format: date-time
    description: Date and time of last mutation.
    examples:
      - "2024-06-15T10:30:00Z"
examples:
  - classCode: "MC000001"
    classVersion: 2
    languageCode: "nl-NL"
    synonym: "Klepbehuizing"
    mutationDate: "2024-06-15T10:30:00Z"
  - classCode: "MC000001"
    classVersion: 2
    languageCode: "de-DE"
    synonym: "Ventilgehäuse"
    mutationDate: "2024-06-15T10:30:00Z"
