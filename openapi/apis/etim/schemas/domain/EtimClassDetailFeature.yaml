type: object
description: |
  Feature within a class detail response, including allowed values.
required:
  - featureCode
  - type
  - orderNumber
  - values
properties:
  featureCode:
    type: string
    description: ETIM feature code.
    pattern: "^EF([0-9]{6}|I[0-9]{5}|[A-Z]{2}[0-9]{4})$"
    examples:
      - "EF000007"
  description:
    type: string
    description: Feature description in the requested language. Absent when no translation is available.
    examples:
      - "Kleur"
  type:
    type: string
    description: Feature data type (Alphanumeric, Numeric, Range, Logical).
    examples:
      - "Alphanumeric"
  orderNumber:
    type: integer
    description: Display order within the class.
    minimum: 1
    examples:
      - 1
  unit:
    $ref: ./EtimUnitReference.yaml
  unitImperial:
    $ref: ./EtimUnitReference.yaml
  featureGroup:
    $ref: ./EtimFeatureGroupReference.yaml
  values:
    type: array
    description: Allowed values for this feature within the class.
    items:
      type: object
      required:
        - valueCode
        - orderNumber
      properties:
        valueCode:
          type: string
          pattern: "^EV[0-9]{6}$"
          examples:
            - "EV000028"
        description:
          type: string
          description: Value description in the requested language. Absent when no translation is available.
          examples:
            - "Wit"
        orderNumber:
          type: integer
          minimum: 1
          examples:
            - 1
examples:
  - featureCode: "EF000007"
    description: "Kleur"
    type: "Alphanumeric"
    orderNumber: 1
    featureGroup:
      code: "EFG00001"
      description: "Algemeen"
    values:
      - valueCode: "EV000028"
        description: "Wit"
        orderNumber: 1
      - valueCode: "EV000054"
        description: "Zwart"
        orderNumber: 2

