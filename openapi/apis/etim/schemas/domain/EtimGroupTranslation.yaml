type: object
description: |
  Translation record for ETIM groups.
required:
  - groupCode
  - languageCode
  - description
  - mutationDate
properties:
  groupCode:
    type: string
    description: ETIM group code.
    pattern: "^EG[0-9]{6}$"
    minLength: 8
    maxLength: 8
    examples:
      - "EG000001"
  languageCode:
    $ref: ./EtimLanguageCode.yaml
  description:
    type: string
    description: Group description in the specified language.
    examples:
      - "Installatie (laagspanning)"
  mutationDate:
    type: string
    format: date-time
    description: Date and time of last mutation.
    examples:
      - "2024-06-15T10:30:00Z"
examples:
  - groupCode: "EG000017"
    languageCode: "nl-NL"
    description: "Installatie (laagspanning)"
    mutationDate: "2024-06-15T10:30:00Z"
  - groupCode: "EG000017"
    languageCode: "de-DE"
    description: "Installation (Niederspannung)"
    mutationDate: "2024-06-15T10:30:00Z"
